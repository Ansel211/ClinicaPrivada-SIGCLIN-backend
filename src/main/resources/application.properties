spring.application.name=SIGCLIN-backend
spring.datasource.driver-class-name=org.postgresql.Driver
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.sql.init.mode=always

server.port=8080
jwt.secret=${TOKEN_JWT_SECRET}
logging.level.org.springframework.security=DEBUG
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update 
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

app.version=1.0.0
server.forward-headers-strategy=FRAMEWORK

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,beans
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Backend del Sistema de Gestion de Clinica Privada (SIGCLIN)
info.app.version=1.0.0